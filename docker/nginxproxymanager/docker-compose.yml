services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 81:81
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - /data/system/state/nginxproxymanager/config:/data
      - /data/system/state/nginxproxymanager/letsencrypt:/etc/letsencrypt
      
