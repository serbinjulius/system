services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
    volumes:
      - /data/system/state/adguardhome/work:/opt/adguardhome/work
      - /data/system/state/adguardhome/conf:/opt/adguardhome/conf
